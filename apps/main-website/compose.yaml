# ─────────────────────────────────────────────────────────────────────────────
# main-website — stateless Next.js frontend.
#
# Custom app image, published to the private Gitea registry (same one every
# other image here is mirrored through — see
# k3s-deployment/supports/25-image-registry/). Requires a one-time
# `docker login gitea.avarile.com -u registry-bot` on this host before
# `docker compose pull` can fetch it.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  backbone:
    external: true

services:
  main-website:
    image: gitea.avarile.com/registry-bot/main-website:latest
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:30587:9587"       # NodePort 30587 — Caddy reaches it here
    networks: [backbone]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9587/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
