# ─────────────────────────────────────────────────────────────────────────────
# Gitea git server. Dedicated `gitea` database on the shared `mysql` service.
# gitea-init provisions the DB/user first (like the k3s gitea-init-db Job).
# SSH clone URLs advertise the external NodePort 30722 (SSH_PORT) while sshd
# binds 22 inside the container (SSH_LISTEN_PORT).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  backbone:
    external: true

services:
  gitea-init:
    image: mysql:8.4.10
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [backbone]
    volumes:
      - ../../scripts:/provision:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${PROVISION_MYSQL_ROOT_PASSWORD}
      DB_NAME: ${GITEA__database__NAME}
      DB_USER: ${GITEA__database__USER}
      DB_PASSWORD: ${GITEA__database__PASSWD}
    command: ["sh", "/provision/provision-mysql.sh"]

  gitea:
    image: gitea/gitea:1.26.4
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    env_file: [.env]                 # GITEA__database__NAME/USER/PASSWD
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: "mysql"
      GITEA__database__HOST: "mysql:3306"
      GITEA__server__DOMAIN: "${PUBLIC_IP}"
      GITEA__server__ROOT_URL: "http://${PUBLIC_IP}:30380/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: "${PUBLIC_IP}"
      GITEA__server__SSH_LISTEN_PORT: "22"     # what sshd binds inside container
      GITEA__server__SSH_PORT: "30722"          # what clone URLs advertise
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
    ports:
      - "127.0.0.1:30380:3000"       # HTTP NodePort 30380 — Caddy reaches it here
      - "30722:22"                   # SSH  NodePort 30722 — public: git+ssh doesn't route through Caddy
    volumes:
      - ${DATA_ROOT}/gitea:/data
    networks: [backbone]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
