# ─────────────────────────────────────────────────────────────────────────────
# EverShop — headless e-commerce platform (Node/Express/React, GraphQL, Postgres
# only — https://github.com/evershopcommerce/evershop). Reuses shared infra:
# a dedicated `evershop` role/db on pgvector, and the `evershop` bucket on MinIO
# for product/media uploads (S3-compatible, same pattern as Twenty/cybernetics).
# No Redis/RabbitMQ/search dependency — EverShop has none (file/DB sessions,
# Postgres-only queries, no message queue).
#
# DB connection is env-var only (DB_HOST/PORT/USER/PASSWORD/NAME — no install
# wizard needed, migrations run automatically on every boot). File-storage
# PROVIDER selection has no env var though — only `system.file_storage` in a
# node-config file — hence the single read-only config/production.json mount
# below; everything else (bucket, credentials, endpoint) is env-driven as usual.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  backbone:
    external: true

services:
  # ── init: create the `evershop` role + database on shared pgvector ──
  evershop-init-db:
    image: postgres:17-alpine
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [backbone]
    volumes:
      - ../../scripts:/provision:ro
    environment:
      PGHOST: pgvector
      PGUSER: ${PROVISION_PG_USER}
      PGPASSWORD: ${PROVISION_PG_PASSWORD}
      NEW_ROLE: evershop
      NEW_ROLE_PASSWORD: ${DB_PASSWORD}
      NEW_DATABASES: "evershop"
      NEW_OWNER: evershop
    command: ["sh", "/provision/provision-postgres.sh"]

  # ── init: create the `evershop` bucket on shared minio ──
  evershop-init-minio:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    security_opt: [no-new-privileges:true]
    networks: [backbone]
    volumes:
      - ../../scripts:/provision:ro
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      BUCKETS: "evershop"
    entrypoint: ["sh", "/provision/provision-minio.sh"]

  evershop:
    image: evershop/evershop:2.2.1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      evershop-init-db:
        condition: service_completed_successfully
      evershop-init-minio:
        condition: service_completed_successfully
    env_file: [.env]                 # DB_PASSWORD, AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY (secret)
    environment:
      # ── Postgres (shared pgvector, dedicated role/db) ──
      DB_HOST: "pgvector"
      DB_PORT: "5432"
      DB_NAME: "evershop"
      DB_USER: "evershop"
      # ── App ──
      PORT: "3000"
      # ── Storage (shared MinIO; PUBLIC_IP so uploaded-file URLs resolve in
      #    the browser, same pattern as cybernetics) ──
      AWS_BUCKET_NAME: "evershop"
      AWS_REGION: "us-east-1"
      AWS_S3_ENDPOINT: "http://minio:9000"
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_BASE_URL: "http://${PUBLIC_IP}:30900/evershop"
    volumes:
      - ./config:/app/config:ro                  # pins system.file_storage = s3
      - ${DATA_ROOT}/evershop:/app/media          # local fallback path; product files live on minio
    ports:
      - "127.0.0.1:30320:3000"       # NodePort 30320 — Caddy reaches it here
    networks: [backbone]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
