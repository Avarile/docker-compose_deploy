# ─────────────────────────────────────────────────────────────────────────────
# Vaultwarden — password manager. Live behind host Caddy at admin.avarile.com
# (Caddy terminates TLS → 127.0.0.1:30820). Web-crypto login REQUIRES https +
# a real domain, so DOMAIN must match the Caddyfile block / DNS record.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  backbone:
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:1.37.1-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    env_file: [.env]                 # ADMIN_TOKEN, SIGNUPS_ALLOWED
    environment:
      DOMAIN: "https://admin.avarile.com"
      # SIGNUPS_ALLOWED comes from .env (default "false"). Flip it to "true"
      # there only long enough to register the first account, then flip back
      # and `docker compose up -d vaultwarden`.
      WEBSOCKET_ENABLED: "true"
      ROCKET_PORT: "80"
    ports:
      - "127.0.0.1:30820:80"         # NodePort 30820 (Caddy → 127.0.0.1:30820)
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data
    networks: [backbone]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
